project: zhanzhan-finance-agent-kit
version: 0.3.0
language: zh-CN
entrypoint: AGENT-ONBOARDING.md
deployment_model: agent-guided
supported_harnesses:
  - generic-feishu-capable-agent
  - feishu-aily
required_capabilities:
  - group_message_read
  - message_resource_download
  - drive_read_write
  - base_schema_read
  - base_controlled_write
  - wiki_create_update
  - image_vision
  - pdf_render
  - local_tool_execution
bundled_tools:
  - name: receipt-split
    entrypoint: scripts/receipt_split.py
    contract: schemas/receipt-split-plan.schema.json
    authority: execute_agent_authored_plan_only
hard_gates:
  - capability_audit
  - tenant_confirmation
  - schema_mapping_confirmation
  - human_field_protection
  - single_file_readonly_canary
  - controlled_write_canary
  - idempotency_verification
  - production_approval
onboarding_stages:
  - onboarding/01-capability-audit.md
  - onboarding/02-tenant-discovery.md
  - onboarding/03-schema-adaptation.md
  - onboarding/04-wiki-bootstrap.md
  - onboarding/05-listener-and-routing.md
  - onboarding/06-readonly-canary.md
  - onboarding/07-controlled-write-canary.md
  - onboarding/08-production-readiness.md
reference_implementation:
  name: 占占四流一致索引中心（AI直做）
  path: reference-implementation
  policy: semantic-reference-not-hardcoded-schema
